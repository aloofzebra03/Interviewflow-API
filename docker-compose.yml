services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interviewflow
    ports:
      - "5432:5432"
    volumes:
      - interviewflow_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  interviewflow_pgdata:
